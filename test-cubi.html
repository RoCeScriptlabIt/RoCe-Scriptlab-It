<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">RoCe ScriptLab It — Routine per Automazione CAD &amp; OFFICE &amp; Sviluppo su Misura</title>
  <meta id="metaDesc" name="description" content="RoCe ScriptLab It: routine AutoLISP e automazioni CAD pronte all'uso o sviluppate su misura, gestione licenze per postazione e supporto tecnico rapido.">
  <meta name="keywords" content="AutoLISP, script AutoCAD, automazione CAD, routine LISP, sviluppo LISP su misura, assistenza ticket CAD, RoCe ScriptLab It">
  <meta name="robots" content="index, follow">

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --border: #334155;
      --ok-bg: #064e3b;
      --ok-text: #a7f3d0;
      --err-bg: #7f1d1d;
      --err-text: #fecaca;
      --warn-bg: #451a03;
      --warn-text: #fde68a;
      --warn-border: #d97706;
      --work-border: #f59e0b;
      --work-text: #fde68a;
      --header-h: 46px;
      --form-w: 312px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .top-strip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 18, 32, 0.97);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
    }

    .top-strip-inner {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    .rights-line {
      color: #cbd5e1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .support-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .support-mail {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .support-mail:hover { text-decoration: underline; }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .lang-btn {
      padding: 3px 9px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #062033;
    }

    .page-shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: calc(var(--header-h) + 18px) 20px 96px;
    }

    .content-col {
      margin-right: calc(var(--form-w) + 20px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .maintenance-box {
      background: var(--warn-bg);
      border: 2px solid var(--warn-border);
      border-radius: 12px;
      padding: 14px 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
    }

    .maintenance-title {
      margin: 0 0 3px;
      font-size: clamp(1.2rem, 2.2vw, 1.75rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fef3c7;
      line-height: 1.15;
    }

    .maintenance-sub {
      margin: 0;
      font-size: 0.86rem;
      color: var(--warn-text);
    }

    /* =========================================================================
       VETRINA 4 CUBI 3D SNELLI (GRIGLIA 2x2 <-> COLONNA STRETTA + 90°)
       ========================================================================= */
    .rc-home-showcase {
      padding: 8px 2px 4px;
    }

    .rc-showcase-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .rc-showcase-heading-wrap .brand {
      margin-bottom: 2px;
    }

    .rc-showcase-title {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.55rem);
      line-height: 1.2;
    }

    .rc-showcase-sub {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .rc-showcase-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rc-mini-btn {
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .rc-mini-btn:hover { border-color: var(--accent); }
    .rc-mini-btn.active { background: var(--accent); color: #062033; border-color: var(--accent); }

    .rc-workspace {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
      transition: grid-template-columns 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .rc-cubes-col {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 14px;
      justify-items: center;
      padding: 6px 0;
    }

    /* Colonna snella quando il cubo è svolto */
    .rc-workspace.is-unfolding {
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 14px;
    }

    .rc-workspace.is-unfolding .rc-cubes-col {
      grid-column: 1;
      grid-template-columns: 1fr;
      gap: 12px;
      justify-items: center;
      padding: 0;
    }

    /* Cubo 3D libero senza riquadro */
    .rc-cube-trigger {
      appearance: none;
      background: transparent;
      border: none;
      padding: 5px 6px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      text-align: center;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .rc-cube-trigger:hover {
      transform: translateY(-3px);
    }

    .rc-cube-trigger.is-active {
      transform: translateX(2px);
    }

    .rc-cube-scene {
      --cube-size: 62px;
      --half: 31px;
      width: 100px;
      height: 100px;
      perspective: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.3s ease, height 0.3s ease;
    }

    .rc-workspace.is-unfolding .rc-cube-scene {
      --cube-size: 44px;
      --half: 22px;
      width: 72px;
      height: 72px;
    }

    .rc-cube-3d {
      width: var(--cube-size);
      height: var(--cube-size);
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-32deg) rotateY(-42deg);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .rc-cube-trigger:hover .rc-cube-3d {
      transform: rotateX(-27deg) rotateY(-34deg) scale(1.06);
    }

    /* Evidenziazione diretta sul cubo 3D aperto */
    .rc-cube-trigger.is-active .rc-cube-3d {
      transform: rotateX(-22deg) rotateY(-24deg) scale(1.14);
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.7));
    }

    .rc-cface {
      position: absolute;
      width: var(--cube-size);
      height: var(--cube-size);
      border-radius: 5px;
      border: 1px solid rgba(148, 163, 184, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      backface-visibility: visible;
      transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    .rc-cface-top {
      background: linear-gradient(135deg, #64748b 0%, #475569 100%);
      color: #f8fafc;
      transform: rotateX(90deg) translateZ(var(--half));
    }

    .rc-cface-front {
      background: linear-gradient(160deg, #334155 0%, #1e293b 100%);
      color: var(--accent);
      transform: translateZ(var(--half));
    }

    .rc-cface-right {
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
      color: #cbd5e1;
      transform: rotateY(90deg) translateZ(var(--half));
    }

    .rc-cface-back {
      background: #0f172a;
      transform: rotateY(180deg) translateZ(var(--half));
    }

    .rc-cface-left {
      background: #1e293b;
      transform: rotateY(-90deg) translateZ(var(--half));
    }

    .rc-cface-bottom {
      background: #090e1a;
      transform: rotateX(-90deg) translateZ(var(--half));
      box-shadow: 0 14px 22px rgba(0, 0, 0, 0.68);
    }

    .rc-cube-trigger.is-active .rc-cface {
      border-color: var(--accent);
    }

    .rc-cube-trigger.is-active .rc-cface-top {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #062033;
    }

    .rc-cube-trigger.is-active .rc-cface-front {
      background: linear-gradient(160deg, #0c4a6e 0%, #082f49 100%);
      color: #7dd3fc;
    }

    .rc-cube-trigger.is-active .rc-cface-right {
      background: linear-gradient(160deg, #082f49 0%, #0f172a 100%);
      color: #bae6fd;
    }

    .rc-cube-label {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      transition: color 0.2s ease;
    }

    .rc-workspace.is-unfolding .rc-cube-label {
      font-size: 0.72rem;
      max-width: 118px;
    }

    .rc-cube-trigger.is-active .rc-cube-label {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .rc-cube-sub {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
    }

    .rc-workspace.is-unfolding .rc-cube-sub {
      font-size: 0.62rem;
    }

    .rc-cube-trigger.is-active .rc-cube-sub {
      color: #7dd3fc;
    }

    /* =========================================================================
       PALCO SVILUPPO RUOTATO DI 90° CON ANTEPRIMA RIALZATA
       ========================================================================= */
    .rc-unfold-stage {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      opacity: 0;
      transform: translateY(8px) scale(0.985);
      transition: opacity 0.34s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .rc-workspace.is-unfolding .rc-unfold-stage {
      display: block;
      grid-column: 2;
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32);
    }

    .rc-workspace.is-unfolding .rc-unfold-stage.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .rc-stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .rc-stage-title {
      margin: 0;
      font-size: 1.05rem;
      color: var(--text);
    }

    .rc-close-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .rc-close-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .rc-net-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      padding: 16px 12px 18px;
      display: flex;
      justify-content: center;
    }

    /*
      Schema ruotato di 90° (3 colonne larghe x 4 righe):
      Riga 1: [ Faccia 5 ] [ vuoto ]    [ vuoto ]
      Riga 2: [ Faccia 1 ] [ Faccia 2 ] [ Faccia 3 ]
      Riga 3: [ vuoto ]    [ Faccia 4 ] [ Faccia 6 ]
      Riga 4: [ vuoto ]    [ vuoto ]    [ vuoto ]
    */
    .rc-net-90 {
      display: grid;
      grid-template-columns: repeat(3, minmax(116px, 142px));
      grid-template-rows: repeat(3, minmax(116px, 142px));
      gap: 8px;
      justify-content: center;
    }

    .rc-slot-5 { grid-column: 1; grid-row: 1; }
    .rc-slot-1 { grid-column: 1; grid-row: 2; }
    .rc-slot-2 { grid-column: 2; grid-row: 2; }
    .rc-slot-3 { grid-column: 3; grid-row: 2; }
    .rc-slot-4 { grid-column: 2; grid-row: 3; }
    .rc-slot-6 { grid-column: 3; grid-row: 3; }

    .rc-face-card {
      position: relative;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      overflow: hidden;
      z-index: 1;
      opacity: 0;
      transform: scale(0.84) rotate(-5deg);
      animation: unfoldFace 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.26s ease;
    }

    .rc-face-card:nth-child(1) { animation-delay: 0.02s; }
    .rc-face-card:nth-child(2) { animation-delay: 0.06s; }
    .rc-face-card:nth-child(3) { animation-delay: 0.1s; }
    .rc-face-card:nth-child(4) { animation-delay: 0.14s; }
    .rc-face-card:nth-child(5) { animation-delay: 0.18s; }
    .rc-face-card:nth-child(6) { animation-delay: 0.22s; }

    @keyframes unfoldFace {
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .rc-face-card.is-settled {
      opacity: 1;
      animation: none;
      transform: translateY(0) scale(1);
    }

    .rc-face-card.is-settled:hover,
    .rc-face-card.is-settled:focus-within {
      transform: translateY(-6px) scale(1.24);
      border-color: var(--accent);
      box-shadow: 0 18px 32px rgba(2, 6, 23, 0.8), 0 0 0 1px rgba(56, 189, 248, 0.55);
      z-index: 25;
    }

    .rc-face-preview-tag {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      padding: 2px 5px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.92);
      color: #062033;
      font-size: 0.56rem;
      font-weight: 800;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .rc-face-card.is-settled:hover .rc-face-preview-tag,
    .rc-face-card.is-settled:focus-within .rc-face-preview-tag {
      opacity: 1;
    }

    .rc-face-num {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 3;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(11, 18, 32, 0.85);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.62rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rc-face-link {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: 100%;
      height: 100%;
      text-decoration: none;
      color: var(--text);
      position: relative;
    }

    .rc-face-link img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.65;
    }

    .rc-face-caption {
      position: relative;
      z-index: 2;
      padding: 7px;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.96) 0%, rgba(2, 6, 23, 0.55) 70%, transparent 100%);
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .rc-face-work {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      background: repeating-linear-gradient(
        -45deg,
        rgba(15, 23, 42, 0.95),
        rgba(15, 23, 42, 0.95) 9px,
        rgba(30, 41, 59, 0.85) 9px,
        rgba(30, 41, 59, 0.85) 18px
      );
      border: 1px dashed var(--work-border);
      border-radius: 9px;
      color: var(--work-text);
      font-size: 0.74rem;
      font-weight: 700;
    }

    .rc-face-more-btn {
      width: 100%;
      height: 100%;
      border: none;
      background: linear-gradient(145deg, rgba(2, 132, 199, 0.42), rgba(11, 18, 32, 0.96));
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      font-size: 0.74rem;
      font-weight: 800;
      gap: 5px;
    }

    .rc-more-plus {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #062033;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-weight: 900;
    }

    .rc-overflow-panel {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .rc-overflow-panel.open { display: block; }

    .rc-overflow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 7px;
      margin-top: 8px;
    }

    .rc-overflow-item {
      display: block;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .rc-overflow-item:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    body.mobile-lite .rc-workspace.is-unfolding {
      grid-template-columns: 1fr;
    }

    body.mobile-lite .rc-workspace.is-unfolding .rc-cubes-col {
      grid-column: 1 / -1;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    body.mobile-lite .rc-workspace.is-unfolding .rc-unfold-stage {
      grid-column: 1 / -1;
    }

    body.mobile-lite .rc-net-90 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto;
      width: 100%;
    }

    body.mobile-lite .rc-face-card {
      grid-column: auto !important;
      grid-row: auto !important;
      min-height: 104px;
    }

    body.mobile-lite .rc-face-card.is-settled:hover,
    body.mobile-lite .rc-face-card.is-settled:focus-within {
      transform: translateY(-3px) scale(1.08);
    }

    @media (max-width: 820px) {
      .rc-workspace,
      .rc-workspace.is-unfolding {
        grid-template-columns: 1fr;
      }

      .rc-cubes-col,
      .rc-workspace.is-unfolding .rc-cubes-col {
        grid-column: 1 / -1;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .rc-workspace.is-unfolding .rc-unfold-stage {
        grid-column: 1 / -1;
      }

      .rc-cube-scene,
      .rc-workspace.is-unfolding .rc-cube-scene {
        --cube-size: 48px;
        --half: 24px;
        width: 7
